[project]
name = "octopus-array"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pandas", "scipy"]

[project.optional-dependencies]
analysis = ["matplotlib", "umap-learn", "scikit-learn"]

[tool.setuptools]
packages = ["model", "estimate", "train", "analysis"]

[tool.pytest.ini_options]
testpaths = ["test"]
