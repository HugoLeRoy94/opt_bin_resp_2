[project]
name = "octopus-array"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pandas", "scipy"]

[project.optional-dependencies]
analysis = ["matplotlib", "seaborn", "umap-learn", "scikit-learn"]

# tasks/ is included so a figure can be run from anywhere: an IDE interactive
# cell sets the working directory to the workspace root, not the file's folder,
# and __file__ is undefined there, so neither CWD nor __file__ can be used to
# find the repository. An editable install removes the question entirely.
[tool.setuptools.packages.find]
include = ["model*", "estimate*", "train*", "analysis*", "tasks*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["test"]
